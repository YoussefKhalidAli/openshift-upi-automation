- name: Setup LDAP server
  import_tasks: setup_ldap.yml

- name: Create LDAP Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "ldap-secret"
        namespace: openshift-config
      type: Opaque
      data:
        bindPassword: YWRtaW5wYXNzd29yZA==
