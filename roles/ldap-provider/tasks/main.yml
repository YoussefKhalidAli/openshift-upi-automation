- name: Configure OAuth with LDAP
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: config.openshift.io/v1
      kind: OAuth
      metadata:
        name: cluster
      spec:
        identityProviders:
          - name: ldapidp
            mappingMethod: claim
            type: LDAP
            ldap:
              url: "ldap://openldap.ldap.svc.cluster.local:389/ou=users,dc=openshift,dc=net?uid?sub?(objectClass=inetOrgPerson)"
              bindDN: "cn=admin,dc=openshift,dc=net"
              bindPassword:
                name: ldap-secret
              insecure: true
              attributes:
                id:
                  - uid
                email:
                  - mail
                name:
                  - cn
                preferredUsername:
                  - uid
