- name: Install required python packages
  apt:
    name:
      - python3-kubernetes
      - python3-ldap
    state: present

- name: Create neccessary directories on master
  file:
    state: directory
    path: "{{ looped_master_dir }}"
    owner: core
    group: core
  loop:
    - "/home/core/.kube"
    - "{{ master_dir }}"
    - "{{ master_dir }}/01-mcp"
    - "{{ master_dir }}/05-htpass-users"
    - "{{ master_dir }}/08-ldap-sync"
    - "{{ master_dir }}/11-ingress-cert"
    - "{{ master_dir }}/12-api-cert"
  loop_control:
    loop_var: looped_master_dir
  delegate_to: "{{ groups['masters'][0] }}"

- name: Create neccessary directories locally
  file:
    state: directory
    path: "{{ looped_dir }}"
  become: True
  loop:
    - "{{ dir }}"
    - "{{ dir }}/01-mcp"
    - "{{ dir }}/05-htpass-users"
    - "{{ dir }}/06-ldap-provider"
    - "{{ dir }}/08-ldap-sync"
    - "{{ dir }}/11-ingress-cert"
    - "{{ dir }}/12-api-cert"
  loop_control:
    loop_var: looped_dir

- name: Copy kubeconfig to master
  copy:
    src: "{{ kubeconfig }}"
    dest: /home/core/.kube/config
    owner: core
    group: core
    mode: "0600"
  delegate_to: "{{ groups['masters'][0] }}"

- name: Approve CSRs
  include_tasks: approve-csrs.yml
  vars:
    csr_username: "{{ csr.username }}"
    csr_signer: "{{ csr.signer }}"
  loop:
    - username: "system:serviceaccount:openshift-machine-config-operator:node-bootstrapper"
      signer: "kubernetes.io/kube-apiserver-client-kubelet"
    - username: "system:node:ip-10-0-1-"
      signer: "kubernetes.io/kubelet-serving"
    - username: "system:node:ip-10-0-1-"
      signer: "kubernetes.io/kube-apiserver-client"
  loop_control:
    loop_var: csr

# Install helm
- name: Download Helm install script
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: "0755"

- name: Run Helm install script
  command: /tmp/get_helm.sh
